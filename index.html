<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>American Mah Jongg · NYC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Limelight&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: a wood-rimmed felt table under a deco night-sky header; your rack sits below the felt, the coaching panel at right. */
:root{
  --gold:#ecc66d;--gold-hi:#f8e3a3;--gold-lo:#b8892f;--gold-dk:#7a5815;
  --sky-1:#16304a;--sky-2:#0a1622;--sky-3:#050b11;
  --felt-hi:#16786a;--felt:#0e5a4f;--felt-lo:#063a33;--felt-edge:#032822;
  --wood-1:#7a4a24;--wood-2:#3a210e;--wood-3:#2a170a;
  --panel-1:rgba(17,38,58,.86);--panel-2:rgba(8,20,32,.94);
  --txt:#f5eedc;--muted:#9fb2bd;--felt-txt:#d4e9e2;
  --line:rgba(236,198,109,.24);--line-strong:rgba(236,198,109,.7);
  --red:#e5484d;--green:#3fbf7a;--violet:#b46cff;--ember:#ff7a45;
  --paper:#fbf5e6;--paper-2:#f2e6c8;--paper-ink:#1d1a14;--paper-muted:#6b604a;
  --display:"Limelight",Georgia,"Times New Roman",serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--body);color:var(--txt);min-height:100vh;overflow-x:hidden;
  background:radial-gradient(1400px 800px at 50% -10%,var(--sky-1) 0,var(--sky-2) 55%,var(--sky-3) 100%) fixed,var(--sky-3);
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;opacity:.05;
  background:repeating-linear-gradient(45deg,#fff 0 1px,transparent 1px 26px),repeating-linear-gradient(-45deg,#fff 0 1px,transparent 1px 26px)}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:20;padding-top:env(safe-area-inset-top,0px);
  background:linear-gradient(180deg,rgba(5,11,17,.96),rgba(8,18,28,.9));backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.topbar::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.55}
.bar-in{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;max-width:1380px;margin:0 auto;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.brand{display:flex;align-items:center;gap:12px}
.emblem{position:relative;width:48px;height:42px;flex:none}
.emblem .tile{position:absolute;--w:24px}
.emblem .tile:first-child{left:2px;top:4px;transform:rotate(-11deg)}
.emblem .tile:last-child{left:20px;top:2px;transform:rotate(9deg)}
h1{font-family:var(--display);font-weight:400;font-size:22px;letter-spacing:1.5px;margin:0;line-height:1.05;
  background:linear-gradient(180deg,var(--gold-hi),var(--gold) 55%,var(--gold-lo));-webkit-background-clip:text;background-clip:text;color:transparent}
.brand small{display:block;font-size:9.5px;letter-spacing:.42em;color:var(--muted);font-weight:700;margin-top:3px}
.scores{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto}
.chip{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:999px;padding:3px 11px 3px 3px;font-size:12px;transition:background .4s,border-color .4s}
.chip b{color:var(--gold);font-variant-numeric:tabular-nums;min-width:2ch;text-align:right}
.chip.up{background:rgba(63,191,122,.18);border-color:rgba(63,191,122,.6)}
.chip.down{background:rgba(229,72,77,.16);border-color:rgba(229,72,77,.55)}
.tools{display:flex;gap:6px}
.bullet{width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;color:#fff;flex:none;box-shadow:inset 0 -2px 0 rgba(0,0,0,.2)}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;font:600 13px var(--body);border:0;border-radius:11px;padding:10px 16px;cursor:pointer;position:relative;overflow:hidden;color:var(--txt);
  transition:transform .15s,filter .2s,background .2s,border-color .2s,box-shadow .2s;white-space:nowrap}
.btn svg{width:16px;height:16px;flex:none}
.btn:active{transform:translateY(1px) scale(.98)}
.btn-gold{background:linear-gradient(180deg,#f6dc8f,#d6a645 55%,#b98a2c);color:#2b1d02;box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 2px 0 var(--gold-dk),0 8px 20px rgba(236,198,109,.22)}
.btn-gold::after{content:"";position:absolute;top:0;left:-70%;width:45%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);transition:left .7s}
.btn-gold:hover::after{left:140%}
.btn-gold:hover{filter:brightness(1.05)}
.btn-ghost{background:rgba(255,255,255,.05);border:1px solid var(--line)}
.btn-ghost:hover{background:rgba(236,198,109,.12);border-color:rgba(236,198,109,.55)}
.btn-red{background:linear-gradient(180deg,#ff7b6e,#d1342b);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 2px 0 #7e1a14,0 0 24px rgba(255,90,80,.55);animation:pulse 1.2s infinite}
.btn:disabled{opacity:.4;cursor:not-allowed;filter:grayscale(.4)}
.btn:disabled::after{display:none}
.btn.sm{padding:6px 11px;font-size:12px;border-radius:9px}
.btn.icon{padding:9px}
@keyframes pulse{50%{box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 2px 0 #7e1a14,0 0 6px rgba(255,90,80,.2)}}

/* ---------- layout ---------- */
.layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:18px;max-width:1380px;margin:0 auto;padding-block:18px 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media(max-width:1020px){.layout{grid-template-columns:minmax(0,1fr)}}
.table{display:flex;flex-direction:column;gap:14px;min-width:0}

/* ---------- felt ---------- */
.felt{position:relative;border-radius:30px;padding:16px;display:grid;gap:14px;
  grid-template-columns:minmax(140px,210px) minmax(0,1fr) minmax(140px,210px);grid-template-areas:"top top top" "left pool right";
  border:11px solid transparent;
  background:radial-gradient(120% 95% at 50% 42%,var(--felt-hi) 0,var(--felt) 38%,var(--felt-lo) 78%,var(--felt-edge) 100%) padding-box,
    linear-gradient(145deg,var(--wood-1),var(--wood-2) 40%,#6b3f1d 68%,var(--wood-3)) border-box;
  box-shadow:0 30px 70px rgba(0,0,0,.55),inset 0 0 0 1px rgba(236,198,109,.45),inset 0 0 90px rgba(0,0,0,.45)}
.felt::before{content:"";position:absolute;inset:0;border-radius:19px;pointer-events:none;opacity:.35;mix-blend-mode:overlay;
  background-image:radial-gradient(rgba(255,255,255,.14) 1px,transparent 1px);background-size:3px 3px}
.felt::after{content:"";position:absolute;inset:8px;border-radius:15px;pointer-events:none;border:1px solid rgba(236,198,109,.16)}
@media(max-width:760px){.felt{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"top top" "left right" "pool pool";padding:10px;border-width:8px;border-radius:24px}}

/* ---------- seats ---------- */
.seat{position:relative;z-index:1;padding:10px 12px 12px;border-radius:16px;background:rgba(2,22,19,.45);border:1px solid rgba(236,198,109,.15);
  transition:box-shadow .35s,border-color .35s,background .35s;min-width:0}
.seat-top{grid-area:top;justify-self:center;width:min(100%,540px)}
.seat-left{grid-area:left}.seat-right{grid-area:right}
.seat.turn{border-color:var(--line-strong);box-shadow:0 0 0 1px rgba(236,198,109,.45),0 0 32px rgba(236,198,109,.22);background:rgba(2,22,19,.62)}
.plate{display:flex;align-items:center;gap:10px}
.avatar{position:relative;width:36px;height:36px;flex:none}
.avatar .bullet{width:36px;height:36px;font-size:17px;box-shadow:0 3px 8px rgba(0,0,0,.4),inset 0 -2px 0 rgba(0,0,0,.2)}
.turn .avatar::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:2px solid var(--gold);animation:ring 1.5s ease-out infinite}
@keyframes ring{from{transform:scale(.85);opacity:1}to{transform:scale(1.35);opacity:0}}
.meta{min-width:0}
.pname{font-weight:800;font-size:14px;line-height:1.2}
.pinfo{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.seat .pinfo{color:var(--felt-txt);opacity:.8}
.dots{margin-left:auto;display:none;gap:4px;padding-right:2px}
.thinking .dots{display:flex}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--gold);animation:dot 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,80%,100%{opacity:.25;transform:none}40%{opacity:1;transform:translateY(-3px)}}
.backs{display:flex;flex-wrap:wrap;gap:2px;margin-top:10px}
.back{display:block;width:13px;height:18px;border-radius:3px;flex:none;
  background:radial-gradient(circle at 50% 50%,rgba(236,198,109,.75) 0 1.3px,transparent 1.8px),linear-gradient(160deg,#1f8f7c,#0c4a40);
  box-shadow:inset 0 0 0 1px rgba(236,198,109,.65),0 2px 0 #efe3c4,0 3px 0 #bfae86,0 4px 6px rgba(0,0,0,.4)}
.reveal{display:flex;flex-wrap:wrap;gap:2px;margin-top:10px}
.exps{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.exp{display:flex;gap:2px;padding:3px;border-radius:8px;background:rgba(0,0,0,.25);border:1px solid rgba(236,198,109,.18)}

/* ---------- pool ---------- */
.pool{grid-area:pool;position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;min-height:270px;padding:4px 0;min-width:0}
.banner{text-align:center;margin-bottom:12px;max-width:520px}
.banner.swap{animation:swap .45s cubic-bezier(.2,1,.3,1)}
@keyframes swap{from{opacity:0;transform:translateY(6px)}}
.status{font-family:var(--display);font-size:23px;color:var(--gold);text-shadow:0 2px 12px rgba(0,0,0,.55);text-wrap:balance;line-height:1.15}
.banner .sub{font-size:12.5px;color:var(--felt-txt);opacity:.9;margin-top:4px;line-height:1.45;text-wrap:balance}
.dir{display:inline-flex;width:34px;height:34px;border-radius:50%;align-items:center;justify-content:center;margin-bottom:6px;background:rgba(236,198,109,.14);border:1px solid rgba(236,198,109,.45)}
.dir svg{width:20px;height:20px;transform:rotate(var(--r));color:var(--gold)}
.dir svg path{animation:nudge 1.2s ease-in-out infinite}
@keyframes nudge{50%{transform:translateX(2.5px)}}
.discards{display:flex;flex-wrap:wrap;justify-content:center;align-content:flex-start;gap:4px;padding:12px;min-height:96px;width:100%;max-width:600px;
  border-radius:16px;background:rgba(0,0,0,.14);box-shadow:inset 0 2px 14px rgba(0,0,0,.3)}
.discards .dw{display:block}
.empty{align-self:center;margin:auto;font-size:12px;color:var(--felt-txt);opacity:.5;letter-spacing:.08em;text-transform:uppercase}
.wallmeter{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--felt-txt);margin-top:12px;width:min(100%,380px);font-variant-numeric:tabular-nums}
.wallmeter b{color:var(--txt)}
.wallmeter .bar{flex:1;height:6px;border-radius:6px;background:rgba(0,0,0,.3);overflow:hidden}
.wallmeter .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold-lo),var(--gold));transition:width .5s}
.wallstack{position:relative;width:24px;height:24px;flex:none}
.wallstack .back{position:absolute}
.wallstack .back:nth-child(1){left:0;top:4px}.wallstack .back:nth-child(2){left:5px;top:2px}.wallstack .back:nth-child(3){left:10px;top:0}
/* washing the tiles */
.wash{position:relative;width:100%;max-width:600px;height:150px;border-radius:16px;background:rgba(0,0,0,.14);box-shadow:inset 0 2px 14px rgba(0,0,0,.3);overflow:hidden}
.wash .back{position:absolute;left:calc(50% - 9px);top:calc(50% - 12px);width:18px;height:25px;animation:wash 1.45s cubic-bezier(.45,0,.3,1) var(--d) both}
@keyframes wash{0%{transform:none}30%{transform:translate(var(--x1),var(--y1)) rotate(var(--r1))}65%{transform:translate(var(--x2),var(--y2)) rotate(var(--r2))}100%{transform:translate(calc(var(--x2)*.15),calc(var(--y2)*.1)) rotate(0)}}

/* ---------- tiles ---------- */
.tile{--w:48px;position:relative;width:var(--w);height:calc(var(--w)*1.4);flex:none;border-radius:calc(var(--w)*.15);
  background:linear-gradient(160deg,#fffdf6,#f2e8cf);
  box-shadow:inset 0 0 0 calc(var(--w)*.045) #fff,inset 0 0 0 calc(var(--w)*.075) #e2d5b5,0 calc(var(--w)*.09) 0 #17705f,0 calc(var(--w)*.1) 0 var(--gold-lo),0 calc(var(--w)*.16) calc(var(--w)*.2) rgba(0,0,0,.45);
  user-select:none;-webkit-user-select:none;transition:transform .14s,box-shadow .14s}
.tile::before{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(155deg,rgba(255,255,255,.75),transparent 38%);pointer-events:none;z-index:1;opacity:.55}
.tile svg{position:absolute;inset:0;width:100%;height:100%}
.tile.xs{--w:22px}.tile.sm{--w:28px}.tile.md{--w:38px}
.tile.flyer{position:fixed;z-index:60;margin:0;transform-origin:0 0;pointer-events:none;transition:none}
.tile.back-tile{background:radial-gradient(circle at 50% 50%,rgba(236,198,109,.8) 0 2px,transparent 3px),linear-gradient(160deg,#1f8f7c,#0c4a40);box-shadow:inset 0 0 0 2px rgba(236,198,109,.6),0 4px 10px rgba(0,0,0,.4)}
.incoming{visibility:hidden}
.rack .tile{--w:50px;cursor:grab;touch-action:none;z-index:1}
.rack .tile:hover{transform:translateY(-5px)}
.rack .tile.sel{transform:translateY(-15px);box-shadow:inset 0 0 0 calc(var(--w)*.045) #fff,inset 0 0 0 calc(var(--w)*.075) #e2d5b5,0 0 0 3px var(--gold),0 0 26px rgba(236,198,109,.75),0 calc(var(--w)*.16) calc(var(--w)*.2) rgba(0,0,0,.45)}
.rack .tile.dragging{z-index:10;transition:none;cursor:grabbing;box-shadow:0 0 0 3px var(--gold),0 18px 30px rgba(0,0,0,.6)}
.rack .tile.deal{animation:deal .55s cubic-bezier(.2,1.15,.3,1) backwards}
@keyframes deal{from{opacity:0;transform:translateY(-70px) rotate(-10deg) scale(.7)}}
.tile.new{animation:drop .45s cubic-bezier(.2,1.4,.4,1)}
.tile.new::after{content:"";position:absolute;top:-5px;right:-5px;width:10px;height:10px;border-radius:50%;background:var(--ember);box-shadow:0 0 8px var(--ember);z-index:2}
@keyframes drop{from{translate:0 -24px;opacity:0}}
.tile.last{box-shadow:inset 0 0 0 calc(var(--w)*.045) #fff,inset 0 0 0 calc(var(--w)*.075) #e2d5b5,0 0 0 2px var(--ember),0 0 16px rgba(255,122,69,.75);animation:glow 1.6s ease-in-out infinite}
@keyframes glow{50%{box-shadow:inset 0 0 0 calc(var(--w)*.045) #fff,inset 0 0 0 calc(var(--w)*.075) #e2d5b5,0 0 0 2px var(--ember),0 0 4px rgba(255,122,69,.3)}}
.tile.miss{opacity:.28;filter:grayscale(.6)}
.tile.wj{box-shadow:inset 0 0 0 calc(var(--w)*.045) #fff,0 0 0 2px var(--violet)}

/* ---------- your rack ---------- */
.me{position:relative;padding:14px 16px 16px;border-radius:22px;background:linear-gradient(180deg,var(--panel-1),var(--panel-2));border:1px solid var(--line);box-shadow:0 20px 44px rgba(0,0,0,.42);transition:border-color .35s,box-shadow .35s}
.me.turn{border-color:var(--line-strong);box-shadow:0 0 0 1px rgba(236,198,109,.42),0 0 44px rgba(236,198,109,.16),0 20px 44px rgba(0,0,0,.42)}
.me-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.turnpill{background:var(--gold);color:#2b1d02;font-weight:800;font-size:10.5px;letter-spacing:.14em;padding:4px 10px;border-radius:999px;box-shadow:0 0 18px rgba(236,198,109,.5)}
.sortbtns{margin-left:auto;display:flex;gap:6px}
.rack{position:relative;display:flex;flex-wrap:wrap;justify-content:center;gap:5px;padding:24px 10px 22px;margin-top:10px;border-radius:14px;min-height:118px;
  background:linear-gradient(180deg,#5d3b1f,#3b2311 62%,#28160a);box-shadow:inset 0 2px 0 rgba(255,255,255,.08),inset 0 -10px 18px rgba(0,0,0,.45),0 10px 24px rgba(0,0,0,.45)}
.rack::after{content:"";position:absolute;left:10px;right:10px;bottom:7px;height:7px;border-radius:4px;background:linear-gradient(#80542d,#4a2c14);box-shadow:0 -1px 0 rgba(255,255,255,.12);z-index:0}
.actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;margin-top:14px;min-height:42px}
.callbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;padding:10px 14px;border-radius:14px;
  background:linear-gradient(180deg,#f8dc8a,#e0b04a);color:#2a1d00;font-weight:800;box-shadow:0 0 34px rgba(236,198,109,.45);animation:rise .35s cubic-bezier(.2,1.3,.4,1)}
.callbar .btn-ghost{color:#2a1d00;border-color:rgba(122,88,21,.6);background:rgba(255,255,255,.25)}
.callbar .btn-ghost:hover{background:rgba(255,255,255,.5)}
@keyframes rise{from{opacity:0;transform:translateY(12px) scale(.96)}}
@media(max-width:640px){.rack .tile{--w:40px}.rack{gap:3px;padding:20px 6px 20px}.sortbtns{margin-left:0;width:100%}.pool{min-height:180px}}

/* ---------- side panels ---------- */
.side{min-width:0}
.panel{padding:16px;border-radius:18px;background:linear-gradient(180deg,var(--panel-1),var(--panel-2));border:1px solid var(--line);margin-bottom:16px;box-shadow:0 14px 30px rgba(0,0,0,.35)}
.ph{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.panel h3{font-family:var(--display);font-weight:400;color:var(--gold);margin:0;font-size:18px;letter-spacing:.5px;flex:1;display:flex;align-items:center;gap:10px}
.panel h3::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:12px;color:var(--muted);user-select:none}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.switch .track{position:relative;width:36px;height:20px;border-radius:999px;background:rgba(255,255,255,.12);border:1px solid var(--line);transition:background .25s}
.switch .knob{position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--muted);transition:transform .25s cubic-bezier(.3,1.4,.5,1),background .25s}
.switch input:checked+.track{background:rgba(236,198,109,.3)}
.switch input:checked+.track .knob{transform:translateX(16px);background:var(--gold)}
.switch input:focus-visible+.track{outline:2px solid var(--gold);outline-offset:2px}
.sub{font-size:12px;color:var(--muted)}
.muted-note{font-size:12.5px;color:var(--muted);line-height:1.5;padding:6px 0}
.hint{padding:10px;margin:0 -10px;border-radius:12px;border-top:1px solid rgba(236,198,109,.1);transition:background .2s}
.hint:first-of-type{border-top:0}
.hint.best{background:rgba(236,198,109,.07);border:1px solid rgba(236,198,109,.3);margin-bottom:4px}
.hint .t{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:7px}
.hcat{font-weight:800;font-size:13.5px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tag{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;background:var(--gold);color:#2b1d02;padding:2px 7px;border-radius:999px;font-weight:800}
.why{font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.4}
.hint .tiles{display:flex;flex-wrap:wrap;gap:2px;align-items:flex-end}
.hint .foot{font-size:11px;color:var(--muted);margin-top:7px}
.gap{width:5px}
.hintlist{position:relative;max-height:var(--three,560px);overflow-y:auto;overscroll-behavior:contain;margin:0 -6px;padding:0 6px;scrollbar-width:thin;scrollbar-color:rgba(236,198,109,.35) transparent;
  -webkit-mask-image:linear-gradient(180deg,#000 calc(100% - 26px),transparent);mask-image:linear-gradient(180deg,#000 calc(100% - 26px),transparent)}
.more{font-size:11px;color:var(--muted);text-align:center;padding:6px 0 18px;letter-spacing:.06em}
.hpat{font:800 13px var(--mono);letter-spacing:1px;margin-top:3px;overflow-wrap:anywhere;line-height:1.4}
.panel .cg{color:#4fd08a}.panel .cr{color:#ff7a7a}.panel .cb{color:#74adff}.panel .cn{color:var(--txt)}
.hr{display:flex;align-items:center;gap:4px;flex:none}
.pill.dead{background:rgba(229,72,77,.18);color:#ff8a80}
.star{border:0;background:none;cursor:pointer;font-size:18px;line-height:1;padding:3px 4px;border-radius:6px;color:rgba(255,255,255,.25);transition:transform .15s,color .15s}
.star:hover{transform:scale(1.2);color:rgba(236,198,109,.7)}
.star.on{color:var(--gold);text-shadow:0 0 10px rgba(236,198,109,.6)}
.modal .star{color:#d6c9a4;font-size:20px}.modal .star.on{color:#c99a3b;text-shadow:none}
.pill{background:rgba(236,198,109,.15);color:var(--gold);border-radius:999px;padding:2px 9px;font-weight:700;font-size:11.5px;white-space:nowrap}
.pill.done{background:var(--gold);color:#2b1d02;box-shadow:0 0 14px rgba(236,198,109,.6)}
.log{max-height:230px;overflow:auto;font-size:12px;line-height:1.55;color:#c7d3da;scrollbar-width:thin;scrollbar-color:rgba(236,198,109,.35) transparent}
.log div{padding:4px 0;border-bottom:1px dashed rgba(255,255,255,.06)}
.log div.fresh{animation:fadein .5s}
@keyframes fadein{from{opacity:0;transform:translateX(-6px)}}

/* ---------- toast, fx ---------- */
.toast{position:fixed;left:50%;top:40%;z-index:48;pointer-events:none;transform:translate(-50%,-50%);animation:toast 1.6s forwards;white-space:nowrap;
  padding:12px 48px;background:linear-gradient(90deg,transparent,rgba(5,11,17,.88) 18%,rgba(5,11,17,.88) 82%,transparent)}
.toast::before,.toast::after{content:"";position:absolute;left:10%;right:10%;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.toast::before{top:0}.toast::after{bottom:0}
.toast span{font-family:var(--display);font-size:clamp(24px,4.6vw,40px);color:var(--gold);text-shadow:0 0 30px rgba(236,198,109,.55)}
.toast.big span{font-size:clamp(34px,8vw,68px)}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-30%) scale(.85)}14%{opacity:1;transform:translate(-50%,-50%) scale(1.04)}22%{transform:translate(-50%,-50%) scale(1)}78%{opacity:1}100%{opacity:0;transform:translate(-50%,-62%)}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:55}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:46}

/* ---------- modals ---------- */
.modal{position:fixed;inset:0;background:rgba(2,8,14,.74);backdrop-filter:blur(5px);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;animation:fade .25s}
@keyframes fade{from{opacity:0}}
.modal .box{background:linear-gradient(180deg,var(--paper),var(--paper-2));color:var(--paper-ink);border-radius:20px;padding:24px;max-width:780px;width:100%;max-height:90vh;overflow:auto;
  border:2px solid var(--gold-lo);box-shadow:inset 0 0 0 6px var(--paper),inset 0 0 0 7px #d8bf7d,0 30px 80px rgba(0,0,0,.6);animation:modalin .4s cubic-bezier(.2,1.25,.4,1)}
@keyframes modalin{from{opacity:0;transform:translateY(16px) scale(.96)}}
.modal h2{font-family:var(--display);font-weight:400;margin:0 0 10px;color:#7d5e18;font-size:28px;text-wrap:balance}
.modal p{line-height:1.55;max-width:65ch}
.modal .btn-ghost{color:#3b2f17;border-color:#cdb67a;background:rgba(255,255,255,.4)}
.modal .btn-ghost:hover{background:#fff}
.mrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.tabs{display:flex;gap:6px;margin:6px 0 12px}
.tabs button{border:0;border-radius:9px;padding:8px 13px;font:600 13px var(--body);cursor:pointer;background:#eadfc3;color:#5a4a26}
.tabs button.on{background:var(--paper-ink);color:var(--gold)}
.cat{font-family:var(--display);background:#0b1622;color:var(--gold);padding:6px 11px;border-radius:7px;margin-top:14px;letter-spacing:1px}
.card-row{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:2px 8px;padding:8px 4px;border-bottom:1px solid #e2d5b5}
.pat{font:800 17px var(--mono);letter-spacing:1.5px;overflow-wrap:anywhere}
.note{font-size:12.5px;color:var(--paper-muted);grid-column:2/4}
.cg{color:#1f8a4c}.cr{color:#d62828}.cb{color:#1f5fbf}.cn{color:var(--paper-ink)}
textarea{width:100%;min-height:240px;font:13px/1.5 var(--mono);border:1px solid #cdbb8c;border-radius:10px;padding:10px;background:#fffdf7;color:var(--paper-ink)}
code{background:#efe4c8;padding:1px 5px;border-radius:4px}
.err{color:#b3261e;font-size:13px}.ok{color:#1f7a3f;font-size:13px;font-weight:700}
.win-tiles{display:flex;flex-wrap:wrap;gap:4px;margin:14px 0;padding:14px;border-radius:14px;background:#0b1622;justify-content:center}
.pay{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px}
.pay span{display:inline-flex;gap:6px;align-items:center;padding:5px 11px;border-radius:999px;background:#efe4c8;font-size:13px;font-variant-numeric:tabular-nums}
.pay b.plus{color:#1f7a3f}.pay b.minus{color:#b3261e}
.help h4{margin:16px 0 4px;font-size:14px;letter-spacing:.04em;color:#7d5e18;text-transform:uppercase}
.help p{margin:0 0 8px;font-size:14px}

/* ---------- splash ---------- */
#splash{position:fixed;inset:0;z-index:70;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));
  background:radial-gradient(900px 620px at 50% 38%,rgba(20,52,76,.96),rgba(4,9,14,.985));transition:opacity .6s,visibility .6s}
#splash.hide{opacity:0;visibility:hidden}
.fan{position:relative;width:300px;max-width:100%;height:132px;margin-bottom:26px}
.fan-slot{position:absolute;left:50%;bottom:0;transform-origin:50% 140%;transform:translateX(-50%) rotate(var(--r));animation:fanin 1s cubic-bezier(.2,1.2,.3,1) var(--d) backwards}
.fan-slot .tile{--w:64px;animation:float 4s ease-in-out calc(var(--d) + 1s) infinite}
@keyframes fanin{from{transform:translateX(-50%) translateY(50px) rotate(0);opacity:0}}
@keyframes float{50%{transform:translateY(-5px)}}
.splash-title{font-family:var(--display);font-weight:400;font-size:clamp(36px,7.5vw,68px);margin:0;line-height:1.05;letter-spacing:2px;
  background:linear-gradient(180deg,var(--gold-hi),var(--gold) 55%,var(--gold-lo));-webkit-background-clip:text;background-clip:text;color:transparent;text-wrap:balance}
.splash-tag{letter-spacing:.5em;color:var(--muted);font-size:12px;font-weight:700;margin:12px 0 30px}
.splash-skyline{position:absolute;left:0;right:0;bottom:0;width:100%;height:90px;opacity:.22}
#splash .btn{font-size:15px;padding:13px 28px;border-radius:13px}

@media(max-width:640px){
  .lbl{display:none}
  .scores{order:3;width:100%;margin-left:0;justify-content:center}
  .tools{margin-left:auto}
  h1{font-size:19px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>

function parseTokens(pat){
  const out=[];
  for(const raw of pat.trim().split(/\s+/)){
    let t=raw,s=null;
    if(/[grb]$/.test(t)){s=t.slice(-1);t=t.slice(0,-1)}
    if(!t||!/^[1-9XPDAFNEWSRG0]+$/.test(t))throw new Error(`"${raw}" isn't a valid group`);
    const needsSuit=c=>/[1-9XPD]/.test(c);
    if([...t].some(needsSuit)&&!s)s='g';
    if([...t].every(c=>c===t[0]))out.push({ch:t[0],n:t.length,s:needsSuit(t[0])?s:null});
    else for(const c of t)out.push({ch:c,n:1,s:needsSuit(c)?s:null});
  }
  return out;
}
function parseOpts(str,h){
  for(const w of str.split(/[\s,]+/)){
    if(!w)continue;
    if(/^c$|^concealed$/i.test(w))h.conc=true;
    else if(/^x$/i.test(w))continue;
    else if(/^shift$/i.test(w))h.shift=true;
    else{const m=w.match(/^([XP]):([1-9]+)$/i);if(m)h[m[1].toUpperCase()]=[...m[2]].map(Number);else throw new Error(`unknown option "${w}"`)}
  }
}
function parseCard(text){
  const hands=[],errors=[];
  text.split('\n').forEach((line,i)=>{
    line=line.trim();if(!line||line.startsWith('#'))return;
    const parts=line.split('|').map(x=>x.trim());
    if(parts.length<3){errors.push(`Line ${i+1}: needs Category | hand | points`);return}
    try{
      const toks=parseTokens(parts[1]);const n=toks.reduce((a,t)=>a+t.n,0);
      if(n!==14)throw new Error(`has ${n} tiles, needs 14`);
      const h={cat:parts[0],pat:parts[1],toks,conc:false,shift:false,X:null,P:null,note:(parts[4]||'').replace(/^\(|\)$/g,'')};
      const pm=parts[2].match(/\d+/);if(!pm)throw new Error('points missing');h.pts=+pm[0];
      if(/c/i.test(parts[2]))h.conc=true;
      parseOpts(parts[3]||'',h);
      hands.push(h);
    }catch(e){errors.push(`Line ${i+1}: ${e.message}`)}
  });
  return{hands,errors};
}

const ALLN=[1,2,3,4,5,6,7,8,9];
function expand(h){
  const toks=h.toks;const has=c=>toks.some(t=>t.ch===c);
  const digits=toks.filter(t=>/[1-9]/.test(t.ch)).map(t=>+t.ch);
  const maxD=digits.length?Math.max(...digits):9;
  const shifts=[];if(h.shift)for(let s=0;s<=9-maxD;s++)shifts.push(s);else shifts.push(0);
  const xs=has('X')?(h.X||ALLN):[0],ps=has('P')?(h.P||ALLN):[0],as=has('A')?['R','G','0']:[null];
  const out=[],seen=new Set();
  for(const p of PERMS){const sm={g:SUITS[p[0]],r:SUITS[p[1]],b:SUITS[p[2]]};
    for(const sh of shifts)for(const x of xs)for(const pv of ps){if(has('X')&&has('P')&&x===pv)continue;
      for(const a of as){
        const groups=toks.map(t=>{const c=t.ch;let k;
          if(/[1-9]/.test(c))k=sm[t.s]+(+c+sh);

function buildWall(){
  let id=0;const w=[];
  for(const s of SUITS)for(let n=1;n<=9;n++)for(let c=0;c<4;c++)w.push({id:id++,k:s+n});
  for(const k of ['N','E','W','S','R','G','0'])for(let c=0;c<4;c++)w.push({id:id++,k});
  for(let c=0;c<8;c++){w.push({id:id++,k:'F',v:c});w.push({id:id++,k:'J'})}
  for(let i=w.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[w[i],w[j]]=[w[j],w[i]]}

}

function evalPat(cp,counts,jokers,exps){
  if(cp.hand.conc&&exps.length)return null;
  const used=new Array(cp.groups.length).fill(false);
  for(const e of exps){let fi=-1;for(let i=0;i<cp.groups.length;i++){if(!used[i]&&cp.groups[i].k===e.k&&cp.groups[i].n===e.n){fi=i;break}}
    if(fi<0)return null;used[fi]=true}
  const pn={},bn={};
  cp.groups.forEach((g,i)=>{if(used[i])return;if(g.n<3)pn[g.k]=(pn[g.k]||0)+g.n;else bn[g.k]=(bn[g.k]||0)+g.n});
  let useful=0,bigDef=0;const need={};
  for(const k of new Set([...Object.keys(pn),...Object.keys(bn)])){
    const n=counts[k]||0,p=pn[k]||0,b=bn[k]||0;need[k]=p+b;useful+=Math.min(n,p+b);bigDef+=Math.max(0,b-Math.max(0,n-p));
  }
  useful+=Math.min(jokers,bigDef);

  return{dist:(14-expN)-useful,need,used};
}
function countTiles(tiles){const c={};let j=0;for(const t of tiles){if(t.k==='J')j++;else c[t.k]=(c[t.k]||0)+1}return{c,j}}
function analyze(tiles,exps){
  const {c,j}=countTiles(tiles);const res=[];
  for(const cp of ALL){const r=evalPat(cp,c,j,exps);if(r)res.push({cp,...r})}
  res.sort((a,b)=>a.dist-b.dist||b.cp.hand.pts-a.cp.hand.pts);
  return{res,c,j};
}
function isWin(tiles,exps){
  if(tiles.length+exps.reduce((s,e)=>s+e.n,0)!==14)return null;
  const {res}=analyze(tiles,exps);const wins=res.filter(r=>r.dist===0);if(!wins.length)return null;
  const noJ=![...tiles,...exps.flatMap(e=>e.tiles||[])].some(t=>t.k==='J');
  let best=null,bv=-1;for(const r of wins){const v=r.cp.hand.pts*(noJ&&r.cp.groups.some(g=>g.n>=3)?2:1);if(v>bv){bv=v;best=r.cp}}
  return best;
}

// ================= Bots =================
function tileScores(p){
  const {res,c}=analyze(p.hand,p.exp);const top=res.slice(0,6);const sc={};
  if(!top.length){for(const k in c)sc[k]=Math.random();return sc}
  const d0=top[0].dist;
  for(const k in c){let s=0;top.forEach(r=>{const w=1/Math.pow(1+r.dist-d0,2);s+=w*Math.min(c[k],r.need[k]||0)/c[k]});sc[k]=s+Math.random()*0.02}
  return sc;
}
function chooseDiscard(p){
  const sc=tileScores(p);let best=null,bs=Infinity;
  for(const k in sc)if(sc[k]<bs){bs=sc[k];best=k}
  return best?p.hand.find(t=>t.k===best):p.hand.find(t=>t.k==='J');
}
function botCall(p,k){
  if(k==='J')return null;
  const {res,c,j}=analyze(p.hand,p.exp);const r=res[0];
  if(!r||r.dist>7||r.cp.hand.conc)return null;
  const nk=c[k]||0;if(nk<1)return null;
  for(const g of r.cp.groups){
    if(g.k!==k||g.n<3||nk+j<g.n-1||(r.need[k]||0)<=nk)continue;
    if(evalPat(r.cp,{},0,[...p.exp,{k,n:g.n}]))return g.n;
  }
  return null;
}
function swapTargets(t){const out=[];players.forEach((q,qi)=>q.exp.forEach((e,ei)=>{if(e.k===t.k&&e.tiles.some(x=>x.k==='J'))out.push([qi,ei])}));return out}
function doSwap(pi,t,[qi,ei]){
  const e=players[qi].exp[ei];const ji=e.tiles.findIndex(x=>x.k==='J');const jt=e.tiles[ji];
  const fT=tileRect(t.id)||mini(rectOf('#seat'+pi)),fJ=tileRect(jt.id);
  turnSrc=null;e.tiles[ji]=t;const p=players[pi];p.hand.splice(p.hand.indexOf(t),1);p.hand.push(jt);if(pi!==0)sortHand(p.hand);
  queueFly(t,fT,0,460);if(pi===0)queueFly(jt,fJ,90,460);
  log(`${NAMES[pi]} swapped a ${tname(t.k)} for a Joker from ${pi===qi?(pi===0?'your own':'their own'):(qi===0?'your':NAMES[qi]+"'s")} exposure.`);
  Sound.chime();toast(pi===0?'Joker is yours':`${NAMES[pi]} takes a Joker`);
}
function botSwaps(pi){
  const p=players[pi];let again=true;
  while(again){again=false;const cur=analyze(p.hand,p.exp).res[0]?.dist??99;
    for(const t of p.hand){if(t.k==='J')continue;const tg=swapTargets(t);if(!tg.length)continue;
      const hyp=p.hand.filter(x=>x!==t).concat([{k:'J'}]);
      if((analyze(hyp,p.exp).res[0]?.dist??99)<=cur){doSwap(pi,t,tg[0]);again=true;break}}}
}

// ================= Charleston =================
// Passes 3 (first left) and 7 (second right) allow a blind pass: pass along 1-3 of the incoming tiles unseen.
const CH=[{d:1,n:'right'},{d:2,n:'across'},{d:3,n:'left',blind:true},'decide',{d:3,n:'left'},{d:2,n:'across'},{d:1,n:'right',blind:true},'courtesy'];
function chStep(){return CH[passIdx]}
function takeSel(){return [...sel].map(id=>{const i=players[0].hand.findIndex(t=>t.id===id);return players[0].hand.splice(i,1)[0]})}
function botGive(i,n){const out=[];for(let x=0;x<n;x++){const t=chooseDiscard(players[i]);if(!t||t.k==='J')break;players[i].hand.splice(players[i].hand.indexOf(t),1);out.push(t)}return out}
function doPass(){
  const st=chStep();
  if(st==='courtesy'){
    const want=sel.size,bronx=botCourtesy(2),m=Math.min(want,bronx);
    [...sel].slice(m).forEach(id=>sel.delete(id));
    const ids=[...sel],outR=ids.map(tileRect);const mine=takeSel();
    let theirs=botGive(2,mine.length);
    if(theirs.length<mine.length){players[0].hand.push(...mine.splice(theirs.length))}
    if(want>m)log(m?`Bronx only wanted to trade ${m}, so you each passed ${m}.`:'Bronx didn\'t want a courtesy pass, so nothing was traded.');
    {const m2=Math.min(botCourtesy(1),botCourtesy(3));const a=botGive(1,m2),b=botGive(3,m2);const n2=Math.min(a.length,b.length);
     players[1].hand.push(...a.splice(n2));players[3].hand.push(...b.splice(n2));players[3].hand.push(...a);players[1].hand.push(...b);
     sortHand(players[1].hand);sortHand(players[3].hand);log(n2?`Queens and Brooklyn traded ${n2} across.`:'Queens and Brooklyn skipped their courtesy pass.')}
    players[2].hand.push(...mine);players[0].hand.push(...theirs);sortHand(players[2].hand);
    newIds=new Set(theirs.map(t=>t.id));
    const r2=rectOf('#seat2');mine.forEach((t,x)=>flyAway(t,outR[x],r2,x*70));theirs.forEach((t,x)=>queueFly(t,mini(r2),300+x*80,480));
    if(mine.length)Sound.whoosh();
    if(want<=m)log(mine.length?`Courtesy pass: you traded ${mine.length} with Bronx.`:'You skipped the courtesy pass.');
    sel.clear();startPlay();render();return;
  }
  const k=sel.size;if(k>3||(!st.blind&&k!==3))return;
  const ids=[...sel],outR=ids.map(tileRect);
  const fromSeat=(4-st.d)%4,toSeat=st.d;
  const out=[[],[],[],[]];
  for(let i=1;i<4;i++)out[i]=botGive(i,3);
  const blind=out[fromSeat].splice(0,3-k);
  out[0]=[...takeSel(),...blind];
  newIds=new Set();
  for(let i=0;i<4;i++){const to=(i+st.d)%4;players[to].hand.push(...out[i]);if(to===0)out[i].forEach(t=>newIds.add(t.id))}
  for(let i=1;i<4;i++)sortHand(players[i].hand);
  const toR=rectOf('#seat'+toSeat),fromR=rectOf('#seat'+fromSeat);
  out[0].slice(0,k).forEach((t,x)=>flyAway(t,outR[x],toR,x*70));
  blind.forEach((t,x)=>flyAway(null,mini(fromR,26),toR,120+x*90));
  out[fromSeat].forEach((t,x)=>queueFly(t,mini(fromR),320+x*80,480));
  Sound.whoosh();
  const second=passIdx>3;
  log(`${second?'Second':'First'} Charleston: passed ${st.n}${blind.length?` (${blind.length} blind)`:''}.`);
  if(blind.length)toast(blind.length===3?'Blind pass':`${blind.length} passed blind`);
  sel.clear();passIdx++;render();
}
function botWantsStop(i){const p=players[i];const r=analyze(p.hand,p.exp).res[0];const d=r?r.dist-(14-p.hand.length):99;return d<=3||Math.random()<.12}

// ================= Dead hands (Part 12) =================
// A hand with exposures is dead when no exposed hand on the card can still be finished using
// tiles that aren't already showing in the discards or anyone's exposures. Concealed tiles are never used to judge.
function provablyDead(pi){
  const p=players[pi];if(!p.exp.length)return false;
  const vis={};const add=t=>{vis[t.k]=(vis[t.k]||0)+1};
  discards.forEach(add);players.forEach(q=>q.exp.forEach(e=>e.tiles.forEach(add)));
  const liveJ=8-(vis.J||0);
  for(const cp of ALL){
    const ev=evalPat(cp,{},0,p.exp);if(!ev)continue;
    const pn={},bn={};cp.groups.forEach((g,i)=>{if(ev.used[i])return;if(g.n<3)pn[g.k]=(pn[g.k]||0)+g.n;else bn[g.k]=(bn[g.k]||0)+g.n});
    let ok=true,jNeed=0;
    for(const k of new Set([...Object.keys(pn),...Object.keys(bn)])){const av=TOTAL(k)-(vis[k]||0),pp=pn[k]||0,b=bn[k]||0;
      if(pp>av){ok=false;break}jNeed+=Math.max(0,b-(av-pp))}
    if(ok&&jNeed<=liveJ)return false;
  }
  return true;
}
function checkDead(){
  for(let i=0;i<4;i++){if(dead[i]||!provablyDead(i))continue;dead[i]=true;
    log(i===0?'Your exposures can no longer make any hand on the card with the tiles left. Your hand is dead.':`${NAMES[i]}'s exposures can no longer make any hand on the card. ${NAMES[i]}'s hand is dead.`);
    toast(i===0?'Your hand is dead':`${NAMES[i]}'s hand is dead`);Sound.sad()}
  if(dead.filter(x=>!x).length<=1){phase='over';callState=null;log('Three hands are dead, so this hand ends with no winner.');render();
    openModal(`<h2>No winner</h2><p>Three hands are dead, so the hand ends. No points change hands.</p><div class="mrow"><button class="btn btn-gold" onclick="newGame()">New game</button><button class="btn btn-ghost" onclick="closeModal()">Look at the table</button></div>`);return true}
  return false;
}
function nextAlive(i){let j=(i+1)%4;while(dead[j]&&j!==i)j=(j+1)%4;return j}

// ================= Play =================
function startTurn(i){
  if(checkDead())return;
  if(dead[i]){startTurn(nextAlive(i));return}
  if(!wall.length){endWall();return}
  turnSrc=null;
  const t=wall.pop();players[i].hand.push(t);if(i!==0)sortHand(players[i].hand);turn=i;step='discard';callState=null;
  if(i===0){newIds=new Set([t.id]);selected=null;log(`You drew ${tname(t.k)}.`);queueFly(t,rectOf('#wallStack'),0,460);render();Sound.tap()}
  else{render();later(()=>botAct(i),SPEED)}
}
function botAct(i){
  if(phase!=='play')return;const p=players[i];botSwaps(i);
  const w=isWin(p.hand,p.exp);if(w){win(i,w,turnSrc);return}
  discard(i,chooseDiscard(p));
}
function discard(i,t){
  const from=i===0?tileRect(t.id):(rectOf(`#seat${i} .back:last-child`)||mini(rectOf('#seat'+i)));
  const p=players[i];p.hand.splice(p.hand.indexOf(t),1);discards.push(t);
  log(`${NAMES[i]} discarded ${tname(t.k)}.`);
  selected=null;newIds=new Set();step='wait';
  queueFly(t,from,0,i===0?320:440);render();
  later(()=>Sound.clack(),i===0?250:360);
  later(()=>resolveCalls(i,t),i===0?480:SPEED);
}
// Calling rules:
//  - A discarded Joker can never be called.
//  - Mah Jongg beats any exposure call. Between two Mah Jongg calls (or two exposure calls) the player next in turn after the discarder wins.
//  - Exposure calls make a pung, kong, quint or sextet with the discard plus matching tiles and/or jokers, and the exposure must fit an exposed hand on the card.
//  - Singles and pairs can only be claimed to finish Mah Jongg. Concealed hands can only claim a discard for Mah Jongg.
//  - After calling, the caller discards (no draw) and play continues to the caller's right.
function humanOptions(k){
  const p=players[0];const o={mj:false,exp:[]};if(k==='J')return o;
  if(isWin([...p.hand,{k}],p.exp))o.mj=true;
  const {c,j}=countTiles(p.hand);const nk=c[k]||0;
  for(const n of [3,4,5,6])if(nk+j>=n-1&&ALL.some(cp=>evalPat(cp,{},0,[...p.exp,{k,n}])))o.exp.push(n);
  return o;
}
function resolveCalls(i,t){
  if(phase!=='play')return;
  const order=[1,2,3].map(d=>(i+d)%4),pos=j=>order.indexOf(j);
  let botMJ=null,botExp=null;
  if(t.k!=='J'){
    for(const j of order){if(j===0||dead[j])continue;const w=isWin([...players[j].hand,t],players[j].exp);if(w){botMJ={j,w};break}}
    if(!botMJ)for(const j of order){if(j===0||dead[j])continue;const n=botCall(players[j],t.k);if(n){botExp={j,n};break}}
  }
  if(i!==0&&!dead[0]){
    const o=humanOptions(t.k);
    if(botMJ&&pos(botMJ.j)<pos(0))o.mj=false;   // a Mah Jongg caller sits ahead of you
    if(botMJ)o.exp=[];                          // Mah Jongg outranks exposures
    if(botExp&&pos(botExp.j)<pos(0))o.exp=[];   // an exposure caller sits ahead of you
    if(o.mj||o.exp.length){callState={i,t,o,botMJ,botExp};Sound.chime();render();return}
  }

}
function finishCalls(i,t,botMJ,botExp,choice){

  if(botMJ){discards.pop();players[botMJ.j].hand.push(t);win(botMJ.j,botMJ.w,i);return}
  if(choice&&choice.n){doExpose(0,t.k,choice.n,i);render();return}
  if(botExp){doExpose(botExp.j,t.k,botExp.n,i);render();later(()=>botAct(botExp.j),SPEED);return}

}
function doExpose(pi,k,n,from){
  const p=players[pi];const t=discards.pop();const fromT=tileRect(t.id);const tiles=[t];const moves=[];
  for(let x=0;x<n-1;x++){let idx=p.hand.findIndex(y=>y.k===k);if(idx<0)idx=p.hand.findIndex(y=>y.k==='J');
    const tt=p.hand.splice(idx,1)[0];if(pi===0)moves.push([tt,tileRect(tt.id)]);tiles.push(tt)}
  p.exp.push({k,n,tiles});
  queueFly(t,fromT,0,480);moves.forEach(([tt,r],x)=>queueFly(tt,r,60+x*45,420));
  log(`${NAMES[pi]} called ${tname(k)} for a ${WORD[n].toLowerCase()}.`);
  toast(`${NAMES[pi]}: ${WORD[n]}!`);Sound.chime();

function win(pi,cp,from){

  for(let q=0;q<4;q++){if(q===pi)continue;const amt=from===null?2*v:(q===from?2*v:v);pay[q]-=amt;pay[pi]+=amt}
  for(let q=0;q<4;q++)scores[q]+=pay[q];saveScores();
  log(`${NAMES[pi]} declared Mah Jongg! ${cp.hand.cat}, ${v} pts${jokerless?' (jokerless x2)':''}.`);
  if(pi===0){Sound.fanfare();confetti();toast('Mah Jongg!','big')}else{Sound.sad();toast(`${NAMES[pi]}: Mah Jongg`)}
  render();later(()=>showResult(pi,cp,from,v,jokerless,pay),1300);
}

// ================= Hand coach =================
// Ranks every hand on the card by how realistic it is to finish, not just raw distance:
// missing pair/single tiles cost more (jokers can't fill them), concealed hands cost more (no calling),
// tiles with few live copies left cost more, and hands that need a dead tile are dropped.
const TOTAL=k=>k==='F'||k==='J'?8:4;
function seenCounts(){const s={};const add=t=>{s[t.k]=(s[t.k]||0)+1};
  players[0].hand.forEach(add);discards.forEach(add);players.forEach(p=>p.exp.forEach(e=>e.tiles.forEach(add)));return s}
function assess(cp,c,j,exps,seen,liveJ){
  const ev=evalPat(cp,c,j,exps);if(!ev)return null;
  const pn={},bn={};
  cp.groups.forEach((g,i)=>{if(ev.used[i])return;if(g.n<3)pn[g.k]=(pn[g.k]||0)+g.n;else bn[g.k]=(bn[g.k]||0)+g.n});
  let nat=0,cost=0;const bigs=[];
  for(const k of new Set([...Object.keys(pn),...Object.keys(bn)])){
    const n=c[k]||0,p=pn[k]||0,b=bn[k]||0;
    const nm=Math.max(0,p-n),bm=Math.max(0,b-Math.max(0,n-p));
    const live=TOTAL(k)-(seen[k]||0);
    if(nm>live)return null;                       // a needed pair/single tile is dead
    nat+=nm;cost+=nm*(live-nm<=0?2.3:1.7);
    if(bm)bigs.push({bm,live:live-nm});
  }
  let jl=j;bigs.sort((a,b)=>a.live-b.live);       // spend jokers where real tiles are scarcest
  for(const g of bigs){const use=Math.min(jl,g.bm);jl-=use;const rest=g.bm-use;if(!rest)continue;
    if(rest>g.live+liveJ)return null;
    cost+=rest*(g.live>=rest?1:1.5)}
  if(cp.hand.conc)cost+=1.6+ev.dist*.3;
  cost-=cp.hand.pts*.005;
  return{score:cost,nat,dist:ev.dist};
}
function rankHands(tiles,exps){
  const {res,c,j}=analyze(tiles,exps);if(!res.length)return[];
  const seen=seenCounts();const liveJ=Math.max(0,8-(seen.J||0));const minD=res[0].dist;const out=[];
  for(const r of res){if(r.dist>minD+3)break;const a=assess(r.cp,c,j,exps,seen,liveJ);if(a)out.push({cp:r.cp,need:r.need,...a})}
  out.sort((x,y)=>x.score-y.score||x.dist-y.dist||y.cp.hand.pts-x.cp.hand.pts);
  return out;
}
function whyText(r){
  const h=r.cp.hand,bits=[];
  if(h.conc)bits.push('Concealed: you can only call a tile for Mah Jongg');
  if(r.nat)bits.push(`${r.nat} pair/single tile${r.nat>1?'s':''} jokers can't cover`);
  if(!bits.length)bits.push('Exposed hand: you can call discards and use jokers');
  return bits.join(' · ');
}

function patternTilesHTML(cp,tiles,exps){
  const {c,j}=countTiles(tiles);const avail={...c};let jl=j;const r=evalPat(cp,c,j,exps);const used=r?r.used:[];
  return cp.groups.map((g,i)=>{let h='';
    if(used[i]){for(let x=0;x<g.n;x++)h+=tileHTML(g.k,'xs');return h}
    const have=Math.min(g.n,avail[g.k]||0);avail[g.k]=(avail[g.k]||0)-have;let rest=g.n-have,jf=0;
    if(g.n>=3){jf=Math.min(rest,jl);jl-=jf;rest-=jf}
    for(let x=0;x<have;x++)h+=tileHTML(g.k,'xs');for(let x=0;x<jf;x++)h+=tileHTML(g.k,'xs wj');for(let x=0;x<rest;x++)h+=tileHTML(g.k,'xs miss');
    return h}).join('<div class="gap"></div>');
}

   <p><b>${cp.hand.cat}</b> · <span class="pat">${patColored(displayPat(cp.hand))}</span><br>
   ${from===null?'Self-drawn, so everyone pays double.':`Won on ${from===0?'your':NAMES[from]+"'s"} discard, so ${from===0?'you pay':NAMES[from]+' pays'} double.`}${jl?' Jokerless, so the value doubles.':''} Hand value: <b>${v}</b>.</p>
   <div class="win-tiles">${[...p.exp.flatMap(e=>e.tiles),...p.hand].map(t=>tileHTML(t,'md')).join('')}</div>
   <div class="pay">${NAMES.map((n,i)=>`<span>${n} <b class="${pay[i]>0?'plus':pay[i]<0?'minus':''}">${pay[i]>0?'+':''}${pay[i]}</b></span>`).join('')}</div>
   <div class="mrow"><button class="btn btn-gold" onclick="newGame()">New game</button><button class="btn btn-ghost" onclick="closeModal()">Look at the table</button></div>`);
}
// Shows a hand the way the printed card writes it: X becomes a real number, P a second number, any-dragon A becomes D.
function displayPat(h){
  const xd=h.X?h.X[0]:1;const pd=h.P?(h.P.find(v=>v!==xd)||h.P[0]):(xd<=6?xd+3:xd-3);
  return h.pat.split(/\s+/).map(t=>{const s=/[grb]$/.test(t)?t.slice(-1):'';const body=s?t.slice(0,-1):t;
    return body.replace(/X/g,xd).replace(/P/g,pd).replace(/A/g,'D')+s}).join(' ');
}
function handNote(h){
  if(h.note)return h.note;
  const bits=[];if(h.shift)bits.push('Any consecutive numbers');if(h.X)bits.push('Like numbers: '+h.X.join(', '));
  if(/X/.test(h.pat)&&!h.X)bits.push('Any like numbers');if(/A/.test(h.pat))bits.push('Any dragon');
  return bits.join(', ');
}
function patColored(pat){return pat.split(/\s+/).map(t=>{const s=/[grb]$/.test(t)?t.slice(-1):'n';const body=s==='n'?t:t.slice(0,-1);return `<span class="c${s}">${body}</span>`}).join(' ')}
function showCard(tab='view'){
  const tabs=`<div class="tabs"><button class="${tab==='view'?'on':''}" onclick="showCard('view')">Card in play</button><button class="${tab==='edit'?'on':''}" onclick="showCard('edit')">Load my card</button></div>`;
  if(tab==='view'){
    let html=`<h2>The Card</h2>${tabs}<p style="font-size:13px;color:var(--paper-muted);margin:0">Playing with: <b>${cardMode==='mine'?'a loaded card':'your 2026 card'}</b>. Green, red and blue mean different suits. 0 is Soap. X means exposed, C concealed. Tap ★ on up to 3 hands to track them while you play.</p>`;
    let cat='';for(const h of HANDS){if(h.cat!==cat){cat=h.cat;html+=`<div class="cat">${cat}</div>`}
      const note=handNote(h);
      html+=`<div class="card-row"><button class="star${isStar(h)?' on':''}" data-star="${h.id}" aria-pressed="${isStar(h)}" aria-label="Star this hand" title="Star this hand">★</button><div class="pat">${patColored(displayPat(h))}</div><div><b>${h.conc?'C':'X'} ${h.pts}</b></div>${note?`<div class="note">${note}</div>`:''}</div>`}
    html+=`<div class="mrow"><button class="btn btn-gold" onclick="closeModal()">Close</button></div>`;
    openModal(html);
    document.querySelectorAll('.modal [data-star]').forEach(b=>b.onclick=()=>{const h=HANDS[+b.dataset.star];if(toggleStar(h)){b.classList.toggle('on',isStar(h));b.setAttribute('aria-pressed',isStar(h));render()}});
  }else{
    openModal(`<h2>Load my card</h2>${tabs}
     <p style="font-size:14px"><b>Fastest:</b> upload a card file (handy when next year's card comes out). <input type="file" id="cardFile" accept=".txt,text/plain" style="font-size:13px"></p>
     <p style="font-size:14px">Or type hands, one per line: <code>Category | hand | points | options</code></p>
     <ul style="font-size:13px;line-height:1.7;margin-top:0">
      <li>Groups like the card: <code>FF 2222 4444 6666</code>. Mixed groups like <code>NEWS</code>, <code>2026</code> or <code>369</code> count as singles.</li>
      <li>Color letter after number groups: <code>g</code> green, <code>r</code> red, <code>b</code> blue. Example: <code>FF 222g 444g 666r 888r</code></li>
      <li><code>X</code> = any like number · <code>P</code> = a second, different number · <code>D</code> = dragon matching its color · <code>A</code> = any dragon · <code>R</code>/<code>G</code>/<code>0</code> = Red, Green, Soap · <code>F</code> flower · <code>N E W S</code> winds</li>
      <li>Options: <code>C</code> concealed · <code>shift</code> = "any consecutive numbers" (write it starting at 1) · <code>X:2468</code> limits X to those numbers</li>
      <li>Example: <code>Consecutive Run | FF 1111g 2222r 3333b | 25 | shift</code></li>
     </ul>
     <textarea id="cardText" placeholder="2468 | FF 2222g 4444g 6666g | 25">${(myCardText||'').replace(/</g,'&lt;')}</textarea>
     <div id="cardMsg" style="margin:8px 0"></div>
     <div class="mrow"><button class="btn btn-gold" id="useMine">Save and play my card</button>
     <button class="btn btn-ghost" id="usePractice">Back to my 2026 card</button></div>`);
    const ta=document.getElementById('cardText'),msg=document.getElementById('cardMsg');
    const check=()=>{const r=parseCard(ta.value);msg.innerHTML=(r.hands.length?`<div class="ok">${r.hands.length} hands read correctly</div>`:'')+r.errors.slice(0,8).map(e=>`<div class="err">${e}</div>`).join('')};
    ta.oninput=check;check();
    document.getElementById('cardFile').onchange=e=>{const fl=e.target.files[0];if(!fl)return;fl.text().then(t=>{ta.value=t;check()})};
    document.getElementById('useMine').onclick=()=>{const r=parseCard(ta.value);if(!r.hands.length){msg.innerHTML='<div class="err">No valid hands yet. Each line needs Category | hand | points.</div>';return}
      myCardText=ta.value;cardMode='mine';try{localStorage.setItem('amj_mycard',myCardText);localStorage.setItem('amj_cardmode','mine')}catch(e){}
      loadCard();newGame()};
    document.getElementById('usePractice').onclick=()=>{myCardText=ta.value;cardMode='practice';try{localStorage.setItem('amj_mycard',myCardText);localStorage.setItem('amj_cardmode','practice')}catch(e){}loadCard();newGame()};
  }
}
function showHelp(){openModal(`<div class="help"><h2>How to play</h2>
 <p>Be the first to build exactly 14 tiles that match one hand on the card. The card decides what wins. The rules below decide how you get, expose, swap and use tiles.</p>
 <h4>Seats</h4>
 <p>You start as East. East gets 14 tiles and throws first without drawing. After every hand, win or wall game, East moves one seat to the right. Play goes to the right.</p>
 <h4>Charleston</h4>
 <p>First Charleston, required: pass 3 right, 3 across, 3 left. A second Charleston (left, across, right) only happens if all four players agree. If anyone wants to stop, it's skipped. Once it starts, it has to finish. Then comes an optional courtesy pass of 0 to 3 tiles with the player across. You both trade the smaller number either of you wants. Jokers can never be passed.</p>
 <p><b>Blind pass:</b> on the first left and the second right only, you can pass fewer than 3 of your own tiles. The rest come from the tiles being passed to you and go straight on without you seeing them.</p>
 <p><b>Heavenly Hand:</b> if East is dealt a complete hand, East declares Mah Jongg right away. If East completes a hand during the Charleston, East declares before the first discard.</p>
 <h4>Your turn</h4>
 <p>Draw (automatic), swap for Jokers if you want, declare Mah Jongg if your hand is complete, otherwise discard. You can throw the tile you just drew. Tap a tile to select it and hit Discard. Tap it again to deselect.</p>
 <h4>Calling</h4>
 <p>Only the newest discard can be claimed. Call it for a PUNG (3), KONG (4), QUINT (5) or SEXTET (6) of identical tiles, using matching tiles, Jokers or both. The group must fit an exposed (X) hand on the card. It goes face up, you discard without drawing, and play continues to your right. Seats you skip lose their turn.</p>
 <p>You can't call a tile for a single, a pair, a run, NEWS or 2026 unless it finishes Mah Jongg. You can claim any tile, even for a pair or single, when it completes your whole hand, including a concealed (C) hand. A discarded Joker can never be called. If several players want a tile, Mah Jongg wins over an exposure. Between two of the same kind of call, the player next in turn after the thrower gets it. You never have to call.</p>
 <h4>Exposures</h4>
 <p>Exposed groups stay face up and can't grow. Calling another of the same tile makes a new group, not a bigger one. You can switch to a different hand as long as all your exposures still fit it.</p>
 <h4>Jokers</h4>
 <p>Jokers fill in for tiles in groups of 3 or more identical tiles, including Flowers. They never go in singles, pairs, runs, NEWS or 2026. On your turn, after you draw or call, you can trade the real tile for any exposed Joker, yours or anyone's, as many times as you can. Select the tile and hit Swap for Joker. You can't swap with a discard. A win made by a Joker swap counts as self-drawn.</p>
 <h4>Dead hands</h4>
 <p>If a player's exposures can no longer make any hand on the card with the tiles still out (judged only from discards and exposures), that hand is dead. A dead hand sits out the rest of the hand but still pays the winner. If three hands are dead, the hand ends with no winner.</p>
 <h4>Scoring</h4>
 <p>Win on a discard: the thrower pays double, the other two pay the hand's value. Self-drawn or Joker-swap win: everyone pays double. A hand with no Jokers doubles its value, except Singles and Pairs, which can't use Jokers anyway. If your tiles match more than one hand, you get the highest-scoring one. If the wall runs out, nobody pays. The last discard can still be called first.</p>
 <h4>Your NYC tiles</h4>
 <p>Dots are bagels, Bams are Art Deco towers, Craks are Big Apples, Winds are street signs, Red is a hydrant, Green is the Liberty torch, Soap (White, also used as zero) is a Broadway marquee star. Flowers, all interchangeable: pizza, One WTC, hot dog, Liberty crown, Brooklyn Bridge, subway car, coffee cup, Coney Island wheel. Jokers are yellow cabs. Red goes with Craks, Green with Bams, Soap with Dots.</p>
 <div class="win-tiles">${['D5','B5','C5','N','R','G','0'].map(k=>tileHTML(k,'md')).join('')}${[0,1,2,3,4,5,6,7].map(v=>tileHTML({k:'F',v},'md')).join('')}${tileHTML('J','md')}</div>
 <div class="mrow"><button class="btn btn-gold" onclick="closeModal()">Got it</button></div></div>`)}

function renderSoundBtn(){const b=$('#btnSound');b.innerHTML=Sound.on?ICON_ON:ICON_OFF;const l=Sound.on?'Mute sound':'Turn sound on';b.title=l;b.setAttribute('aria-label',l)}
function startFromSplash(){Sound.init();$('#splash').classList.add('hide');newGame()}
$('#btnSound').onclick=()=>{Sound.on=!Sound.on;try{localStorage.setItem('amj_sound',Sound.on?'on':'off')}catch(e){}renderSoundBtn();if(Sound.on){Sound.init();Sound.chime()}};
$('#btnCard').onclick=()=>showCard('view');
$('#btnHelp').onclick=showHelp;

addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#modal').innerHTML)closeModal()});
$('#emblem').innerHTML=tileHTML({k:'F',v:3})+tileHTML('J');
$('#fan').innerHTML=[{k:'F',v:3},'R','J','G',{k:'F',v:0}].map((t,x)=>`<div class="fan-slot" style="--r:${(x-2)*13}deg;--d:${x*90}ms">${tileHTML(t)}</div>`).join('');
renderSoundBtn();
render();
