// ---- same-browser stand-in for PeerJS (testing only) ----
class LocalPeer{
  constructor(id){this.id=id||'p'+Math.random().toString(36).slice(2,10);this.h={};this.conns={};this.bc=new BroadcastChannel('amj-local-net');
    this.bc.onmessage=e=>this._msg(e.data);setTimeout(()=>this._emit('open',this.id),20)}
  on(ev,f){this.h[ev]=f;return this}
  _emit(ev,...a){this.h[ev]&&this.h[ev](...a)}
  connect(to){const c=new LocalConn(this,to,Math.random().toString(36).slice(2));this.conns[c.cid]=c;this.bc.postMessage({k:'open',from:this.id,to,cid:c.cid});
    setTimeout(()=>{if(!c.opened)this._emit('error',{type:'peer-unavailable'})},2500);return c}
  _msg(m){if(m.to!==this.id)return;const c=this.conns[m.cid];
    if(m.k==='open'){const n=new LocalConn(this,m.from,m.cid);this.conns[m.cid]=n;this._emit('connection',n);this.bc.postMessage({k:'ack',from:this.id,to:m.from,cid:m.cid});setTimeout(()=>{n.opened=true;n._emit('open')},0)}
    else if(m.k==='ack'&&c){c.opened=true;c._emit('open')}
    else if(m.k==='data'&&c)c._emit('data',m.d);
    else if(m.k==='close'&&c){delete this.conns[m.cid];c.open=false;c._emit('close')}}
  destroy(){Object.values(this.conns).forEach(c=>c.close());try{this.bc.close()}catch(e){}}
}
class LocalConn{
  constructor(p,peer,cid){this.p=p;this.peer=peer;this.cid=cid;this.h={};this.open=true;this.opened=false}
  on(ev,f){this.h[ev]=f;return this}
  _emit(ev,...a){this.h[ev]&&this.h[ev](...a)}
  send(d){if(this.open)this.p.bc.postMessage({k:'data',from:this.p.id,to:this.peer,cid:this.cid,d:JSON.parse(JSON.stringify(d))})}
  close(){if(!this.open)return;this.open=false;try{this.p.bc.postMessage({k:'close',from:this.p.id,to:this.peer,cid:this.cid})}catch(e){}}
}
function loadPeerLib(){

const makePeer=id=>useLocalNet?new LocalPeer(id):(id?new Peer(id,{debug:0}):new Peer({debug:0}));

async function createRoom(px){

  peer.on('open',()=>{clearTimeout(slow);NET.mode='host';NET.conns={};room={code,started:false,seats:[{name:myName,cid:myCid},null,null,null]};
    SEATNAME=[myName,...botNames()];applySpeed();document.body.classList.add('in-room');startHeartbeat();$('#splash').classList.add('hide');showLobby()});
  peer.on('connection',hostOnConn);

    if(!room)mpMsg(px,`Couldn't reach the multiplayer service (${esc(e&&e.type||'unknown error')}). Check your connection and try again.`,true)});
}
function hostOnConn(conn){
  const c={conn,seat:null,live:true,last:Date.now(),cid:null};const key=Math.random().toString(36).slice(2);NET.conns[key]=c;
  conn.on('data',m=>{c.last=Date.now();if(!m||typeof m!=='object')return;
    if(m.t==='hello')hostHello(c,m);
    else if(m.t==='leave'){try{c.conn.close()}catch(e){}hostDrop(c)}
    else if(m.t==='act'&&c.seat!=null&&room&&room.started&&HUMAN[c.seat])hostAct(c.seat,m)});
  conn.on('close',()=>hostDrop(c));conn.on('error',()=>hostDrop(c));
}
function hostHello(c,m){
  if(!room)return;const name=cleanName(m.name);c.cid=String(m.cid||'').slice(0,40);
  for(const [k,x] of Object.entries(NET.conns))if(x!==c&&x.cid&&x.cid===c.cid){x.live=false;try{x.conn.close()}catch(e){}delete NET.conns[k]}
  let seat=room.seats.findIndex((x,i)=>i>0&&x&&x.cid===c.cid);
  if(seat<0){
    if(room.started){netTo(c,{t:'full',why:'started'});return}
    seat=[2,1,3].find(x=>!room.seats[x]);if(seat==null){netTo(c,{t:'full',why:'full'});return}}
  room.seats[seat]={name,cid:c.cid};c.seat=seat;c.live=true;
  netTo(c,{t:'welcome',seat,code:room.code,card:currentCardText()});
  if(room.started){const back=!HUMAN[seat];HUMAN[seat]=true;SEATNAME[seat]=name;refreshNames();
    if(back)toastAll(v=>v===seat?'Welcome back':`${nameV(seat,v)} is back`);render()}
  lobbyChanged();
}
function hostDrop(c){
  if(!c.live)return;c.live=false;const s=c.seat;
  for(const [k,x] of Object.entries(NET.conns))if(x===c)delete NET.conns[k];
  if(s==null||!room)return;
  if(!room.started){room.seats[s]=null;lobbyChanged();return}
  if(!HUMAN[s])return;
  HUMAN[s]=false;refreshNames();   // a bot plays this seat until they come back
  toastAll(v=>`${SEATNAME[s]} left · a bot is playing for now`);
  if(phase==='charleston')chMaybeFinish();
  else if(phase==='play'){
    if(callState&&callState.offers[s]&&!(s in callState.choices))answerCall(s,'pass');
    else if(turn===s&&step==='discard'&&!callState)later(()=>botAct(s),SPEED)}
  render();lobbyChanged();
}

  const slow=setTimeout(()=>{if(NET.joinStep===1)mpMsg(px,"The multiplayer service didn't answer (step 1 of 3: reaching the server). Check your internet, then try again in a minute.",true)},15000);
  peer.on('open',()=>{clearTimeout(slow);NET.joinStep=2;mpMsg(px,'Looking for the room…');
    const conn=peer.connect(ROOM_PREFIX+code,{reliable:true,serialization:'json'});NET.hostConn=conn;

  peer.on('error',e=>{if(NET.joined){clientLost();return}
    mpMsg(px,e&&e.type==='peer-unavailable'?"Couldn't find that room (step 2 of 3). Check the code, and make sure the host still has the game open.":`Couldn't reach the multiplayer service (${esc(e&&e.type||'unknown error')}). Check your connection and try again.`,true)});

function clientRecv(px,m){
  if(!m||typeof m!=='object')return;
  switch(m.t){
    case 'welcome':NET.mode='client';NET.joined=true;NET.seat=m.seat;NET.lastHost=Date.now();room={code:m.code,seats:null};NET.lost=false;
      useCardText(m.card);document.body.classList.add('in-room','mp-client');startHeartbeat();$('#splash').classList.add('hide');
      if(phase==='idle')showLobby();else{closeModal();toast('Reconnected')}break;
    case 'full':mpMsg(px,m.why==='started'?'That game has already started.':'That room is full.',true);try{NET.peer.destroy()}catch(e){}break;
    case 'lobby':if(room){room.seats=m.seats;room.started=m.started;if(m.rules)NET.rules=m.rules;if($('#lobby'))showLobby()}break;
    case 'state':applyState(m);break;
    case 'toast':toast(esc(m.m),m.kind||'');break;
    case 'result':clientResult(m);break;
    case 'modal':if(m.kind==='wall')openModal(`<h2>Wall game</h2><p>The last tile is gone and nobody made Mah Jongg. ${m.wp?'<b>House rule:</b> every live hand gets 10 points.':'No points change hands.'}</p><div class="mrow"><span class="waitnote">Waiting for ${esc(NAMES[NET.hostView]||'the host')} to deal</span><button class="btn btn-ghost" onclick="closeModal()">Look at the table</button></div>`);
      else openModal(`<h2>No winner</h2><p>Three hands are dead, so the hand ends. No points change hands.</p><div class="mrow"><button class="btn btn-ghost" onclick="closeModal()">Look at the table</button></div>`);
      Sound.sad();break;
    case 'bye':NET.leaving=true;openModal(`<h2>The room closed</h2><p>${esc(NAMES[NET.hostView]||'The host')} left, so the game is over.</p><div class="mrow"><button class="btn btn-gold" onclick="leaveRoom()">Back to solo</button></div>`);break;
  }
}
function applyState(m){
  const prevIds=new Set(players[0].hand.map(t=>t.id)),prevPhase=phase,prevDisc=discards.length,prevTurn=turn,prevPass=passIdx,prevOffer=!!(callState&&callState.o);
  const keep=new Map(players[0].hand.map((t,i)=>[t.id,i]));
  players=m.players;
  const mine=players[0].hand,hostOrder=new Map(mine.map((t,i)=>[t.id,i]));
  const rank=t=>keep.has(t.id)?keep.get(t.id):1000+hostOrder.get(t.id);
  mine.sort((a,b)=>rank(a)-rank(b));                // your own arrangement of your rack stays put
  wall=new Array(m.wallN);discards=m.discards;phase=m.phase;turn=m.turn;step=m.step;passIdx=m.passIdx;dealer=m.dealer;dead=m.dead;scores=m.scores;
  chStop=m.chStop;NET.waiting=m.waiting;NET.rules=m.rules;NET.hostView=m.host;
  callState=m.call?{i:m.call.i,t:m.call.t,o:m.call.o,deadline:m.call.ms?Date.now()+m.call.ms:0,waiting:m.call.waiting}:null;
  NAMES=m.seats.map((x,v)=>v===0?'You':cleanName(x.name));NET.humanV=m.seats.map(x=>x.human);NET.tags=m.seats.map(x=>esc(x.tag||''));
  AV=m.seats.map(x=>avatarFor({...x,name:cleanName(x.name)}));
  const ids=mine.map(t=>t.id);
  if(phase==='shuffle'){newIds=new Set();sel.clear();selected=null;if(prevPhase!=='shuffle'){closeModal();$('#splash').classList.add('hide');Sound.wash()}}
  else if(prevPhase==='shuffle'){dealAnim=true;newIds=new Set();for(let i=0;i<14;i++)setTimeout(()=>Sound.tap(),120+i*45)}
  else newIds=new Set(ids.filter(id=>!prevIds.has(id)));
  if(passIdx!==prevPass||phase!=='charleston')sel.clear();
  for(const id of [...sel])if(!ids.includes(id))sel.delete(id);
  if(selected!=null&&!ids.includes(selected))selected=null;
  if(phase!=='idle'&&$('#lobby'))closeModal();
  if(discards.length>prevDisc)Sound.clack();
  if(phase==='play'&&turn===0&&step==='discard'&&prevTurn!==0)Sound.tap();
  if(callState&&callState.o&&!prevOffer)Sound.chime();
  render();
}
function clientResult(m){
  const pi=m.pi;
  if(pi===0){Sound.fanfare();confetti();toast('Mah Jongg!','big')}else{Sound.sad();toast(`${esc(NAMES[pi])}: Mah Jongg`)}
  setTimeout(()=>{if(NET.mode==='client'&&phase==='over')showResult(pi,{hand:HANDS[m.hid]||{cat:'',pat:''}},m.from,m.v,m.jl,m.pay,m.rule)},1300);
}
function clientLost(){
  if(NET.mode!=='client'||NET.leaving||NET.lost)return;NET.lost=true;
  openModal(`<h2>Connection lost</h2><p>This screen lost its connection to the room. If the host still has the game open, you can rejoin your seat.</p>
    <div class="mrow"><button class="btn btn-gold" id="mpRejoin">Rejoin</button><button class="btn btn-ghost" onclick="leaveRoom()">Back to solo</button></div><p class="mpmsg" id="rjMsg" role="status"></p>`);
  $('#mpRejoin').onclick=()=>{NET.lost=false;joinRoom('rj',room&&room.code||NET.pendingCode)};
}
let hbTimer=null;
function startHeartbeat(){
  if(hbTimer)return;
  hbTimer=setInterval(()=>{
    if(NET.mode==='client'){netSend({t:'ping'});if(NET.lastHost&&Date.now()-NET.lastHost>90000)clientLost()}
    if(NET.mode==='host'){netBroadcast({t:'hb'});for(const c of Object.values(NET.conns))if(c.live&&c.seat!=null&&Date.now()-c.last>30000){try{c.conn.close()}catch(e){}hostDrop(c)}}
  },4000);
}
function leaveRoom(){
  NET.leaving=true;
  if(NET.mode==='host')netBroadcast({t:'bye'});
  if(NET.mode==='client')netSend({t:'leave'});
  setTimeout(()=>{try{NET.peer&&NET.peer.destroy()}catch(e){}location.href=location.pathname+(useLocalNet?'?net=local':'')},150);
}

// ---- screens ----
function mpFormHTML(px){
  return `<div class="mpform">
    <label class="mpfield" for="${px}Name"><span>Your name</span><input id="${px}Name" maxlength="16" autocomplete="nickname" placeholder="What should friends call you?" value="${esc(myName)}"></label>
    <button class="btn btn-gold" id="${px}Create">Create a room</button>
    <div class="mpor"><span>or join a friend's room</span></div>
    <div class="mpjoin"><input id="${px}Code" maxlength="5" autocapitalize="characters" autocomplete="off" spellcheck="false" placeholder="Room code" aria-label="Room code" value="${esc(joinFromURL)}"><button class="btn btn-ghost" id="${px}Join">Join</button></div>
    <p class="mpmsg" id="${px}Msg" role="status"></p></div>`;
}
function mpMsg(px,t,bad){const e=document.getElementById(px+'Msg');if(e){e.textContent=t;e.classList.toggle('bad',!!bad)}}
function bindMpForm(px){
  const nm=document.getElementById(px+'Name'),code=document.getElementById(px+'Code');if(!nm)return;
  const takeName=()=>{const n=cleanName(nm.value);if(!nm.value.trim()){mpMsg(px,'Type your name first so friends know who you are.',true);nm.focus();return false}
    myName=n;try{localStorage.setItem('amj_name',n)}catch(e){}return true};
  document.getElementById(px+'Create').onclick=()=>{Sound.init();if(takeName())createRoom(px)};
  document.getElementById(px+'Join').onclick=()=>{Sound.init();if(takeName())joinRoom(px,code.value)};
  code.oninput=()=>{code.value=code.value.toUpperCase().replace(/[^A-Z0-9]/g,'')};
  code.onkeydown=e=>{if(e.key==='Enter')document.getElementById(px+'Join').click()};
}
function openMultiplayer(){
  if(MP()){showLobby();return}
  const mid=phase==='play'||phase==='charleston';
  openModal(`<h2>Play with friends</h2><p>Make a room and share the code, or join a friend's room. 2 to 4 people can play, and bots fill any empty seats.${mid?' <b>Your solo game ends when you make or join a room.</b>':''}</p>${mpFormHTML('mm')}
    <div class="mrow"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button></div>`);
  bindMpForm('mm');
}
function roomSummaryHTML(r){
  if(!r)return '';
  const hr=r.house?HR.filter(([k])=>r.hr&&r.hr[k]).map(([,l])=>l):[];
  return `<ul class="rulechips" aria-label="Room rules"><li>Suggested hands ${r.hints?'on':'off'}</li><li>${r.proceed?'Everyone taps Proceed':'Moves on automatically'}</li>
    <li>${LEVELS[r.diff??1]} bots · ${(SPEED_NAMES[r.botSpeed]||'Default').toLowerCase()} speed</li><li>${hr.length?`House rules: ${hr.length}`:'Standard rules'}</li></ul>`;
}
function showLobby(){
  if(!room)return;
  const host=NET.mode==='host';
  const seats=host?room.seats:(room.seats||[]);
  const nHuman=(seats||[]).filter(Boolean).length;
  const winds=['East · seat 1','South · seat 2','West · seat 3','North · seat 4'];
  const order=host?[0,1,2,3]:[0,1,2,3];
  const rows=order.map(i=>{const x=seats&&seats[i];const me=host?i===0:(i===NET.seat);
    return `<li class="${x?'filled':''}"><span class="lav" style="background:${x?HUMAN_COL[i]:'transparent'}">${x?esc(x.name.charAt(0).toUpperCase()):''}</span>
      <span class="lnm">${x?esc(x.name)+(me?' <em>(you)</em>':'')+(i===0?' <em>· host</em>':''):'Open seat'}</span><span class="lsub">${x?'':'A bot plays here if nobody joins'}</span></li>`}).join('');
  const started=!!room.started;
  openModal(`<div id="lobby"><h2>${host?'Your room':'You joined the room'}</h2>
    <div class="roomcode"><span class="rc-label">Room code</span><b>${esc(room.code)}</b></div>
    ${host?`<p class="setnote">Friends open the game and tap <b>Multiplayer</b>, then type this code. Or send them the link.</p>
      <div class="mpjoin"><input id="lkInput" readonly value="${esc(inviteLink(room.code))}" aria-label="Invite link"><button class="btn btn-ghost" id="lkCopy">Copy link</button></div>`:''}
    <ul class="lobbyseats">${rows}</ul>
    ${host&&!started?`<p class="setnote">${nHuman<2?'Waiting for at least one friend to join.':`${nHuman} people are in. ${4-nHuman?`${4-nHuman} bot${4-nHuman>1?'s':''} will fill the empty seat${4-nHuman>1?'s':''}.`:'The table is full.'}`}</p>`:''}
    ${roomSummaryHTML(host?RM():(NET.rules||null))}
    ${!host&&!started?`<p class="setnote"><span class="spin"></span> Waiting for ${esc((seats&&seats[0]&&seats[0].name)||'the host')} to start the game.</p>`:''}
    ${started?'<p class="setnote">The game is on. Close this to get back to the table.</p>':''}
    <div class="mrow">${host&&!started?`<button class="btn btn-gold" id="lbStart" ${nHuman<2?'disabled':''}>Start game</button>`:''}
      <button class="btn btn-ghost" id="lbRules">${host?'Room settings':'Room rules'}</button>
      ${started?'<button class="btn btn-gold" onclick="closeModal()">Back to the table</button>':''}
      <button class="btn btn-ghost" id="lbLeave">${host?'Close room':'Leave room'}</button></div></div>`);
  const st=$('#lbStart');if(st)st.onclick=startRoomGame;
  $('#lbRules').onclick=()=>{settingsFromLobby=true;showRoomSettings()};
  $('#lbLeave').onclick=()=>askConfirm({title:host?'Close the room?':'Leave the room?',body:host?'Everyone in the room is sent back to their own solo game.':'You go back to your solo game. A bot plays your seat.',yes:host?'Close room':'Leave room',onYes:leaveRoom});
  const cp=$('#lkCopy');if(cp)cp.onclick=()=>{const i=$('#lkInput');const done=()=>{cp.textContent='Copied'};
    try{navigator.clipboard.writeText(i.value).then(done,()=>{i.select()})}catch(e){i.select()}};
}

// ================= Boot =================
const ICON_ON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
const ICON_OFF='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="m16 9 5 6M21 9l-5 6"/></svg>';
function renderSoundBtn(){const b=$('#btnSound');b.innerHTML=Sound.on?ICON_ON:ICON_OFF;const l=Sound.on?'Mute sound':'Turn sound on';b.title=l;b.setAttribute('aria-label',l)}
function startFromSplash(){if(GAME==='canasta'){try{localStorage.removeItem('amj_canasta_hand')}catch(e){}location.href='canasta.html?deal=1';return}if(NET.mode==='client')return;if(NET.mode==='host'&&room&&!room.started){showLobby();return}Sound.init();$('#splash').classList.add('hide');newGame()}
$('#btnSound').onclick=()=>{Sound.on=!Sound.on;try{localStorage.setItem('amj_sound',Sound.on?'on':'off')}catch(e){}renderSoundBtn();if(Sound.on){Sound.init();Sound.chime()}};
$('#btnCard').onclick=()=>GAME==='hk'?hkShowRules():showCard('view');
$('#btnHelp').onclick=()=>GAME==='hk'?hkShowRules():showHelp();
$('#btnNew').onclick=askNew;
$('#btnStart').onclick=startFromSplash;
$('#btnSettings').onclick=showSettings;
$('#btnMP').onclick=openMultiplayer;
$('#splashMPForm').innerHTML=mpFormHTML('sp');bindMpForm('sp');
const pickTab=mp=>{$('#tabSolo').classList.toggle('on',!mp);$('#tabMP').classList.toggle('on',mp);$('#tabSolo').setAttribute('aria-selected',!mp);$('#tabMP').setAttribute('aria-selected',mp);$('#splashSolo').hidden=mp;$('#splashMP').hidden=!mp};
$('#tabSolo').onclick=()=>pickTab(false);$('#tabMP').onclick=()=>pickTab(true);
if(joinFromURL)pickTab(true);
addEventListener('pagehide',()=>{if(NET.mode==='host')netBroadcast({t:'bye'});if(NET.mode==='client')netSend({t:'leave'})});
const closeHands=()=>document.body.classList.remove('show-hands');
$('#bHandsClose').onclick=closeHands;
addEventListener('pointerdown',e=>{if(!document.body.classList.contains('show-hands'))return;const t=e.target;if(t.closest('.side')||t.closest('#btnHands')||t.closest('#bHands')||t.closest('#modal'))return;closeHands()},true);
$('#btnHands').onclick=()=>document.body.classList.toggle('show-hands');
$('#bHandsCard').onclick=()=>{closeHands();GAME==='hk'?hkShowRules():showCard('view')};
if(!document.fullscreenEnabled)$('#btnFull').hidden=true;
$('#btnFull').onclick=()=>{try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}catch(e){}};
// Home: solo games pause behind the home screen and Resume picks up right where you were.
// ---- choosing a game on the home screen ----
const GAMES={american:{title:'American Mah Jongg',sub:'Play your 2026 card against three computer players.'},
  hk:{title:'Chinese Mahjong',beta:'Beta',tag:'HONG KONG OLD STYLE',sub:'Hong Kong rules against three computer players. You need 3 faan to win (you can change that in Settings).'},
  canasta:{title:'American Canasta',beta:'Alpha',tag:'MODERN AMERICAN RULES',sub:'You and a partner against two computer players, using the Canasta League of America rules. First team to 8,500 wins.'}};
function canastaSaved(){try{const g=JSON.parse(localStorage.getItem('amj_canasta_hand'));return g&&Array.isArray(g.hands)&&!g.over?g:null}catch(e){return null}}
const gameSaved=()=>GAME==='hk'?hkSavedGame():GAME==='canasta'?canastaSaved():savedGame();
function syncSplashButtons(){const cn=GAME==='canasta',live=homeOpen&&!cn,sv=!!gameSaved();const rs=$('#btnResume'),st=$('#btnStart');
  rs.hidden=!live&&!sv;st.textContent=live||sv?(cn?'New hand':'New game'):'Deal me in';rs.textContent=cn?'Resume hand':'Resume game';
  // Canasta: a hand in progress makes Resume the main button, first in line
  const main=cn&&sv;rs.classList.toggle('btn-gold',main);rs.classList.toggle('btn-ghost',!main);st.classList.toggle('btn-gold',!main);st.classList.toggle('btn-ghost',main);
  if(main)rs.parentNode.insertBefore(rs,st);else st.parentNode.insertBefore(st,rs)}
function applyGameLabels(){
  const g=GAMES[GAME];const h1=document.querySelector('.brand h1');if(h1)h1.innerHTML=g.title+(g.beta?` <i class="beta">${g.beta}</i>`:'');
  const st=document.querySelector('.splash-title');if(st)st.innerHTML=g.title+(g.beta?` <i class="beta">${g.beta}</i>`:'');
  const sb=document.querySelector('#splashSolo .splash-sub');if(sb)sb.textContent=g.sub;
  if(g.tag)document.querySelectorAll('.brand small,.splash-tag').forEach(e=>e.textContent=g.tag);
  document.querySelectorAll('[data-game]').forEach(b=>{const o=b.dataset.game===GAME;b.classList.toggle('on',o);b.setAttribute('aria-checked',o)});
  const mp=document.getElementById('tabMP');if(mp){mp.hidden=GAME!=='american';if(GAME!=='american'&&mp.classList.contains('on'))document.getElementById('tabSolo').click()}
  document.body.classList.toggle('game-hk',GAME==='hk');
  const cl=document.querySelector('#btnCard .lbl');if(cl)cl.textContent=GAME==='hk'?'Scoring':'The Card';
  const hb=document.getElementById('bHandsCard');if(hb)hb.textContent=GAME==='hk'?'Scoring':'The Card';
  const sh=document.querySelector('.sheet-bar b');if(sh)sh.textContent=GAME==='hk'?'Coach':'Your hands';
  if(GAME==='hk')document.title='Chinese Mahjong · Hong Kong';if(GAME==='canasta')document.title='American Canasta';
}
function setGame(g){
  if(g===GAME||MP())return;
  try{saveProgress()}catch(e){}
  GAME=g;settings.game=g;saveSettings();
  gid++;paused=false;pausedQ=[];homeOpen=false;undoStack=[];callState=null;building=null;sel=new Set();selected=null;
  loadProgress();shown=[...scores];
  wall=[];discards=[];players=[0,1,2,3].map(()=>({hand:[],exp:[],flowers:[]}));phase='idle';logs=[];logVer++;
  applyTheme();applyGameLabels();syncSplashButtons();render();Sound.tap&&Sound.tap();
}
function goHome(){
  if(MP()){openModal(`<h2>Go to the home screen?</h2><p>${NET.mode==='host'?'This closes the room and everyone goes back to their own solo game.':'You leave the room and a bot plays your seat.'}</p><div class="mrow"><button class="btn btn-gold" onclick="leaveRoom()">${NET.mode==='host'?'Close room':'Leave room'}</button><button class="btn btn-ghost" onclick="closeModal()">Stay</button></div>`);return}
  closeModal();closeHands();
  const live=['charleston','play','over','shuffle'].includes(phase);
  if(live){pauseGame();homeOpen=true}
  syncSplashButtons();
  $('#splash').classList.remove('hide');
}
$('#btnHome').onclick=goHome;
$('#btnGod').onclick=showGod;syncGodBtn();
$('#btnResume').onclick=()=>{if(GAME==='canasta'){location.href='canasta.html?resume=1';return}if(homeOpen){homeOpen=false;$('#splash').classList.add('hide');unpauseGame();render()}else if(GAME==='hk'){if(!hkResume())startFromSplash()}else resumeGame()};
$('#btnHow').onclick=()=>GAME==='canasta'?canastaHelp():GAME==='hk'?hkShowRules():showHelp();
function canastaHelp(){
  openModal(`<div class="help"><h2>American Canasta</h2>
   <p>Modern American Canasta, following the Canasta League of America rules. You and the player across are partners against the two on your sides. First team to <b>8,500</b> wins.</p>
   <h3>Cards</h3><p>Two decks plus four jokers. 2s and jokers are wild. 3s go out on the table with a replacement drawn, except that until your team melds you may hold one 3 in your hand for the Straight (lay it down any time). Values: jokers 50, Aces and 2s 20, 8 through King 10, 4 through 7 5.</p>
   <h3>Your turn</h3><p>Draw one card, or take the whole pack: show two natural cards matching the top card and meld them with it. Meld if you like, then discard one card.</p>
   <h3>Melds</h3><p>Three to seven cards of one rank; seven make a canasta. At least two natural cards and no more than two wilds. After your team's first meld, a meld needs five natural cards before a wild goes in (a table setting). 7s never take wilds; Aces only in the first meld. A closed natural canasta makes its rank dead.</p>
   <h3>Opening</h3><p>Your team's first meld must be worth 125 points (155 from 3,000, 180 from 5,000) and include a clean meld: three natural cards of one rank, or three wild cards. Open early and you get bonus cards.</p>
   <h3>Going out</h3><p>Your team needs two canastas. Meld everything but one card and discard it. Natural canastas score 500, mixed 300, natural Aces or 7s 2,500, wild 2,000 to 3,000. Special hands (before your team melds): Straight 3,000, Pairs 2,500, Pairs with 2s 2,000, Garbage 2,000.</p>
   <p class="setnote">Table and house rules are under the gear button in the game.</p>
   <div class="mrow"><button class="btn btn-gold" onclick="closeModal()">Got it</button></div></div>`)}
document.querySelectorAll('[data-game]').forEach(b=>b.onclick=()=>setGame(b.dataset.game));
applyGameLabels();syncSplashButtons();
addEventListener('keydown',e=>{if(e.key!=='Escape')return;if($('#modal').innerHTML)closeModal();else document.body.classList.remove('show-hands')});
applySpeed();applyTheme();applyLayout();renderSoundBtn();
// Installable app: save the game on the device so solo play works offline (needs https, or localhost for testing)
// a new version reloads the page by itself when nothing is in progress; mid-game it waits for the next visit
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1')){
  const had=!!navigator.serviceWorker.controller;
  addEventListener('load',()=>navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>r.update()).catch(()=>{}));
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!had)return;if(phase==='idle'||phase==='over')location.reload();else toast('An update is ready. It loads next time you open the game.')});
}
render();
</script>
